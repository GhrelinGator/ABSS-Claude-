name: checks

# Runs the guardrail tests and everything else on GitHub's machines, so the
# result does not depend on anyone reporting their own test run.

on:
  push:
    branches: ['**']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Guardrail tests
        run: npm run test:guardrails

      - name: All tests
        run: npm test

      - uses: oven-sh/setup-bun@v2

      - name: Same results on a second JavaScript engine (Node is V8, Bun is JavaScriptCore)
        run: |
          node tests/cross-engine/print-digests.ts > node-digests.json
          bun tests/cross-engine/print-digests.ts > bun-digests.json
          diff node-digests.json bun-digests.json

      - name: Install type-checking packages
        run: npm install --no-audit --no-fund

      - name: Type check, simulation and analysis (no Node or browser APIs allowed)
        run: npx tsc -p tsconfig.pure.json

      - name: Type check, the viewer (browser APIs)
        run: npx tsc -p tsconfig.viewer.json

      - name: Type check, everything else
        run: npx tsc -p tsconfig.json

      - name: Build the viewer page
        run: node --no-warnings scripts/build-site.ts
